<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found | Biruk Aregu</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#101016;--line:rgba(255,255,255,.08);--green:#34d399;--green-d:#10b981;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(52,211,153,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(52,211,153,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);pointer-events:none}
.brand{position:fixed;top:1.4rem;left:1.5rem;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--green);text-decoration:none;font-size:1rem}
.wrap{position:relative;width:100%;max-width:620px;text-align:center}
.code{font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(6rem,22vw,9.5rem);line-height:1;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px rgba(52,211,153,.55);position:relative;user-select:none}
.code span{position:absolute;inset:0;color:var(--green);-webkit-text-stroke:0;clip-path:inset(0 0 100% 0);animation:fill 1.4s cubic-bezier(.22,.61,.36,1) .3s forwards;opacity:.9}
@keyframes fill{to{clip-path:inset(0 0 0 0)}}
h1{font-size:clamp(1.3rem,4vw,1.7rem);font-weight:800;margin:1rem 0 .4rem}
p.sub{color:var(--muted);font-size:.95rem;margin-bottom:1.6rem}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);margin-bottom:1.8rem}
.term-bar{display:flex;align-items:center;gap:.4rem;padding:.6rem .85rem;border-bottom:1px solid var(--line)}
.term-bar i{width:.6rem;height:.6rem;border-radius:50%;display:block}
.term-bar i:nth-child(1){background:#ff5f57}.term-bar i:nth-child(2){background:#febc2e}.term-bar i:nth-child(3){background:#28c840}
.term-bar span{margin-left:.5rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--dim)}
.term-body{padding:1rem 1.1rem;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.75;min-height:8.2rem}
.p{color:var(--green)}.err{color:#f87171}.dim{color:var(--dim)}.path{color:#fbbf24;word-break:break-all}
.cur{display:inline-block;width:.55rem;height:1rem;background:var(--green);vertical-align:-.15rem;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.5rem;border-radius:.6rem;font-weight:600;font-size:.92rem;text-decoration:none;transition:transform .25s ease,background .25s ease,border-color .25s ease}
.btn-p{background:var(--green-d);color:#04130d}
.btn-p:hover{background:var(--green);transform:translateY(-2px)}
.btn-o{border:1.5px solid rgba(255,255,255,.22);color:#fff;background:rgba(12,12,17,.8)}
.btn-o:hover{border-color:rgba(52,211,153,.6);transform:translateY(-2px)}
.btn svg{width:1rem;height:1rem}
@media(prefers-reduced-motion:reduce){.code span{animation:none;clip-path:none}.cur{animation:none}}
</style>
</head>
<body>
<a class="brand" href="/">&lt;/ Biruk Aregu &gt;</a>
<main class="wrap">
<div class="code" aria-hidden="true">404<span>404</span></div>
<h1>Page not found</h1>
<p class="sub">The page you're looking for doesn't exist or was moved.</p>
<div class="term" role="img" aria-label="Terminal showing a 404 error">
<div class="term-bar"><i></i><i></i><i></i><span>~/birukaregu.com</span></div>
<div class="term-body" id="term"></div>
</div>
<div class="actions">
<a class="btn btn-p" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Back home</a>
<a class="btn btn-o" href="/#projects">View projects</a>
</div>
</main>
<script>
(function(){
var path=(location.pathname||'/').replace(/[<>&"]/g,'');if(path.length>48)path=path.slice(0,45)+'...';
var lines=[
 '<span class="p">$</span> curl -I birukaregu.com<span class="path">'+path+'</span>',
 '<span class="err">HTTP/2 404 Not Found</span>',
 '<span class="dim"># this route returned nothing. no threats detected.</span>',
 '<span class="p">$</span> cd ~ <span class="dim"># head back home</span>'
];
var el=document.getElementById('term');
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.innerHTML=lines.join('<br>')+' <span class="cur"></span>';return}
var i=0;function next(){if(i>=lines.length){el.insertAdjacentHTML('beforeend',' <span class="cur"></span>');return}
el.insertAdjacentHTML('beforeend',(i?'<br>':'')+lines[i]);i++;setTimeout(next,i===1?650:520)}
setTimeout(next,500);
})();
</script>
</body>
</html>
